# WandB grid sweep that reproduces Table 1 of the paper (CIFAR-10).
#
# Grid: 6 symmetry groups × 2 modes (attention / conv) × 3 seeds = 36 runs.
#
# Group mapping (paper notation → code name → |G|):
#   ∅*   trivial_2    |G|=1   (translation-only baseline, ≡ ViT+RoPE)
#   Flop flop_2d_2    |G|=2   (2D reflection)
#   C_4  cyclic_4     |G|=4   (4 rotations)
#   C_6  cyclic_6     |G|=6   (6 rotations)
#   D_4  dihedral_2   |G|=4   (2 rotations + 2 reflections)
#   D_6  dihedral_3   |G|=6   (3 rotations + 3 reflections)
#
# Mode mapping:
#   attn → attention=true,  use_key=true   (full softmax attention)
#   conv → attention=false, use_key=false  (linear / convolutional, constant keys)
#
# Hyperparameters fixed to the best config from prior sweeps:
#   freq_init=random, rope_sigma=1.0, ape_sigma=10.0
#
# --- Usage ---
#
# 1. Initialise the sweep (once, from the repo root):
#
#      wandb sweep --entity platonic-transformers-public \
#                  --project Platonic-CIFAR10 \
#                  configs/cifar10_table_sweep.yaml
#
#    WandB prints a SWEEP_ID (e.g. abc12345).
#
# 2. Run agents — each agent consumes runs from the shared queue.
#    On a single GPU machine, process all 36 sequentially:
#
#      wandb agent --count 36 platonic-transformers-public/Platonic-CIFAR10/<SWEEP_ID>
#
#    To parallelise, launch the same command on several GPUs/machines; each
#    agent keeps pulling runs until the queue is exhausted.

program: mains/main_cifar10_table_sweep.py
method: grid
project: Platonic-CIFAR10
entity: platonic-transformers-public

command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --model.freq_init=random
  - --model.rope_sigma=1.0
  - --model.ape_sigma=10.0

parameters:
  solid_name:
    values:
      - trivial_2    # ∅*  paper notation
      - flop_2d_2    # Flop
      - cyclic_4     # C_4
      - cyclic_6     # C_6
      - dihedral_2   # D_4  (|G|=4: 2 rotations + 2 reflections)
      - dihedral_3   # D_6  (|G|=6: 3 rotations + 3 reflections)
  mode:
    values:
      - attn         # softmax attention,  use_key=true
      - conv         # linear / conv mode, use_key=false
  seed:
    values:
      - 1
      - 2
      - 3
